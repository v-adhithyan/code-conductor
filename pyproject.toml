[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-conductor"
version = "0.1.0"
description = "Local-first AI workflows for engineering repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.scripts]
code-conductor = "codeconductor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codeconductor"]
force-include = { "workflows" = "codeconductor/workflows" }

[tool.ruff]
line-length = 100
target-version = "py311"
